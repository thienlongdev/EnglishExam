name: english-exam-demo
services:
  identity:
    image: quay.io/keycloak/keycloak:26.4
    container_name: english-exam-demo-identity
    command: ["start", "--import-realm"]
    env_file: ["./.local/demo/keycloak.env"]
    ports: ["127.0.0.1:8280:8080"]
    volumes:
      - ./.local/demo/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./identity-theme/english-exam:/opt/keycloak/themes/english-exam:ro
    mem_limit: 1g
    restart: unless-stopped
